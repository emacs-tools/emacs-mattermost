[workspace]
resolver = "2"
members = [
  "crates/mm-core",
  "crates/mm-client",
  "crates/mm-store",
  "crates/mm-web",
  "crates/mm-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

mm-core = { path = "crates/mm-core" }
mm-client = { path = "crates/mm-client" }
mm-store = { path = "crates/mm-store" }
mm-web = { path = "crates/mm-web" }
